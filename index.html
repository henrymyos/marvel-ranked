<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Ranked</title>
  <meta name="description" content="Rank every Marvel movie and show">
  <!-- Link preview for chat apps and social sites. Their crawlers don't run
       JavaScript, so this can't be the live top-10 screen — it's a flat image,
       regenerated from scripts/og-card.html (instructions in that file) when
       the example board changes. Absolute URLs: relative ones are ignored. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Marvel Ranked">
  <meta property="og:title" content="Marvel Ranked">
  <meta property="og:description" content="Rank every Marvel movie and show">
  <meta property="og:url" content="https://marvel-ranked-two.vercel.app/">
  <meta property="og:image" content="https://marvel-ranked-two.vercel.app/og-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ten Marvel movie posters with rank badges, one through ten">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦸</text></svg>">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0d0d">
  <!-- Some cover hosts (Fandom) 404 hotlinked images when a foreign Referer
       header is present; sending none keeps every cover loading. -->
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marvel Ranked">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="hero-bg" id="hero-bg" aria-hidden="true"></div>
      <h1>Marvel Ranked</h1>
      <div class="account" id="account"></div>
    </header>

    <nav class="tabs">
      <button data-view="rankings" class="active">Rankings</button>
      <button data-view="phases">Stats &amp; Phases</button>
      <button data-view="vs">vs IMDb &amp; RT</button>
      <button data-view="spiderman">Spider-Man</button>
      <button data-view="heroes">Heroes</button>
      <button data-view="villains">Villains</button>
      <button data-view="legacy">Legacy TV</button>
    </nav>

    <main id="view"></main>

    <footer>Data from the <a href="https://docs.google.com/spreadsheets/d/1-3oeBoGQcb41boRSuKK7dNIwyNLwTf-JehLraKr6XbU/edit">Marvel Ranked</a> Google Sheet. Run <code>scripts/fetch-sheet.mjs</code> to sync ratings.</footer>
  </div>

  <script src="sync.js"></script>
  <script src="data.js"></script>
  <script src="imdb.js"></script>
  <script src="rt.js"></script>
  <script src="covers.js"></script>
  <script src="characters.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<!--
  Source for og-preview.jpg, the image chat apps and social sites show when
  the link is pasted. Crawlers don't run JavaScript, so the preview can't be
  the live showcase — it has to be a flat file, regenerated when the example
  board changes:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=20000 \
      --window-size=1200,630 --screenshot=/tmp/og.png \
      file://$PWD/scripts/og-card.html
    sips -s format jpeg -s formatOptions 80 /tmp/og.png --out og-preview.jpg

  The ten titles come from the same IMDb-ranked list the site seeds a
  first-time visitor's board with, so the picture always matches what they
  land on.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #0d0d0d;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 26px;
    }
    h1 {
      background: #e62429; color: #fff; text-align: center;
      font-size: 54px; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.06em; line-height: 1.1; padding: 10px 34px 13px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .rows { display: grid; gap: 12px; }
    .row { display: flex; gap: 12px; }
    figure {
      position: relative; width: 148px; height: 222px;
      border-radius: 10px; overflow: hidden; background: #1c1c24;
    }
    img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; top: 8px; left: 8px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: #e62429; border: 2px solid #0d0d0d;
      color: #fff; font-size: 16px; font-weight: 800;
    }
  </style>
</head>
<body>
  <h1>Marvel Ranked</h1>
  <div class="rows" id="rows"></div>

  <script src="../data.js"></script>
  <script src="../imdb.js"></script>
  <script src="../covers.js"></script>
  <script>
    // Same selection as the site's exampleTopTen(): highest IMDb rating first.
    // ("top" is a window property, so it can't be the name here.)
    const topTen = MOVIES
      .map((m) => ({ t: m.title, s: IMDB[m.title]?.rating }))
      .filter((x) => x.s != null)
      .sort((a, b) => b.s - a.s)
      .slice(0, 10);

    document.getElementById("rows").innerHTML = [topTen.slice(0, 5), topTen.slice(5, 10)]
      .map((row, r) => `<div class="row">${row.map(({ t }, i) => `
        <figure>
          <img src="${COVERS[t]}" alt="">
          <span class="badge">${r * 5 + i + 1}</span>
        </figure>`).join("")}</div>`)
      .join("");
  </script>
</body>
</html>
